<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Fidra{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700&display=swap">
<style>
:root{--ink:#0A1F3C;--green:#0B7A5F;--mint:#2FD3A0;--paper:#F7F6F2;--cloud:#EEF1F5;--slate:#4B5B73;--line:#C5CEDA}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;margin:0}a{color:inherit;text-decoration:none}
.w{max-width:980px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#fff}header .w{display:flex;align-items:center;gap:22px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font:700 19px Sora}header nav a{color:#9FB1C7;font-size:14px;margin-right:16px;padding-bottom:4px}header nav a.on{color:#fff;border-bottom:2px solid var(--mint)}
.sp{flex:1}.badge{background:var(--mint);color:var(--ink);border-radius:999px;font:600 11px Inter;padding:1px 7px;margin-left:4px}.who{font-size:13px;color:#9FB1C7}.lnk{background:none;border:0;color:#fff;font:500 13px Inter;cursor:pointer;text-decoration:underline}
main{padding-top:30px;padding-bottom:60px}h1{font-size:25px;margin-bottom:6px}.muted{color:var(--slate);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin:16px 0}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:600 14px Sora;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:15px Inter;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
label{display:block;font-size:13px;color:var(--slate);margin:0 0 4px}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
h3.sec{font-size:15px;margin:20px 0 10px}.chip{display:inline-block;padding:2px 11px;border-radius:999px;font:500 12.5px Inter}
.ok{background:#DDF3EB;color:#0B5F4A}.warn{background:#FBEBCB;color:#7A5200}.bad{background:#F8DAD7;color:#8E2A24}.neu{background:var(--cloud);color:var(--slate)}.info{background:#E3EBFD;color:#1F4FB8}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font:600 12px Inter;color:var(--slate);padding:8px 10px}td{padding:12px 10px;border-top:1px solid var(--line)}tr.row:hover{background:var(--paper);cursor:pointer}
.err{background:#F8DAD7;color:#8E2A24;border-radius:8px;padding:10px 14px;margin:14px 0;font-size:14px}
.ban{display:flex;gap:14px;align-items:center;border-radius:12px;padding:18px 20px;margin:14px 0}.ban.ok{background:#DDF3EB}.ban.warn{background:#FBEBCB}.ban.bad{background:#F8DAD7}.ban h2{font-size:19px}.ban p{margin:2px 0 0;font-size:14px}
.tl div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--cloud);font-size:14px}.tl span+span{color:var(--slate)}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px}.copy{display:flex;gap:8px}.copy input{font-family:'JetBrains Mono',monospace;font-size:12.5px}
@media(max-width:720px){.g{grid-template-columns:1fr}.who{display:none}}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style></head><body>
<header class="noprint"><div class="w">
<a class="brand" href="/app/requests"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2FD3A0"/><path d="M22 48V18H44M22 32H36" fill="none" stroke="#0A1F3C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#0A1F3C"><circle cx="44" cy="18" r="6"/><circle cx="36" cy="32" r="6"/><circle cx="22" cy="48" r="6"/></g></svg>Fidra</a>
<nav><a href="/app/requests" class="{{ 'on' if tab=='list' }}">Requests</a><a href="/app/requests/new" class="{{ 'on' if tab=='new' }}">New request</a><a href="/app/inbox" class="{{ 'on' if tab=='inbox' }}">Inbox{% if inbox_count %}<span class="badge">{{ inbox_count }}</span>{% endif %}</a>{% if staff.role in ('admin','supervisor') %}<a href="/app/insights" class="{{ 'on' if tab=='insights' }}">Insights</a>{% endif %}{% if staff.role=='admin' %}<a href="/app/team" class="{{ 'on' if tab=='team' }}">Team</a>{% endif %}</nav>
<span class="sp"></span><a class="who" href="/app/account" title="Your account">{{ staff.full_name }} · {{ staff.institution }}</a>
<form method="post" action="/app/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="lnk">Sign out</button></form>
</div></header>
<main class="w">{% block body %}{% endblock %}</main>
<script>function copyText(id,b){var e=document.getElementById(id);e.select();navigator.clipboard.writeText(e.value).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)})}</script>
</body></html>
