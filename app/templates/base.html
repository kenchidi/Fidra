<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Fidra{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0A1F3C',
            trust: '#0B7A5F',
            rail: '#2F6FED',
            mint: '#2FD3A0',
            amber: '#F0A62B',
            paper: '#F7F6F2',
            cloud: '#EEF1F5',
            slate600: '#4B5B73',
            slate300: '#C5CEDA',
            verified: '#12A072',
            declined: '#D6453D',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Sora', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3 { font-family: 'Sora', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-paper text-ink min-h-screen">
  <header class="border-b border-slate300/60 bg-white">
    <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-3">
      <!-- Node F icon -->
      <div class="w-8 h-8 rounded-lg bg-mint flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <!-- Simplified Node F mark -->
          <circle cx="6" cy="6" r="2.2" fill="#0A1F3C"/>
          <circle cx="6" cy="18" r="2.2" fill="#0A1F3C"/>
          <circle cx="18" cy="6" r="2.2" fill="#0A1F3C"/>
          <path d="M6 8.2V15.8M6 6H16M6 12H14" stroke="#0A1F3C" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="font-display font-semibold text-lg tracking-tight text-ink">Fidra</span>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-sm text-slate600 py-8">
    Powered by Fidra — the rail that moves trust
  </footer>
</body>
</html>
