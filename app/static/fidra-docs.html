<style>

const EX={customer_full_name:'Adaeze Okafor',customer_phone:'+2348012345678',customer_email:'adaeze@example.com',referee_account_number:'0123456789',referee_bank_code:'058',referee_account_name:'Adaeze Okafor',purpose:'account_opening',code:'MFB-0231',name:'Sunrise Microfinance Bank',bank_code:'090',good_standing:'yes',relationship:'1-3_years',comments:'Account in good standing.',reason:'Not my customer'};
function ex(s,k){s=R(s)||{};if(s.anyOf)return ex(s.anyOf.find(x=>x.type!=='null'),k);if(k in EX)return EX[k];if(s.default!==undefined)return s.default;if(s.enum)return s.enum[0];

const tone=s=>/authorized|completed/.test(s)?'ok':/declined|failed|cancelled|expired/.test(s)?'bad':s==='draft'?'neu':'info';

const EXR={public_id:'ref_8f3a92kq',status:'referee_notified',completed_at:null,response_payload:null,note:null,from_status:'submitted',to_status:'referee_notified',actor:'system',expires_at:'2026-10-22T09:30:00Z',api_key:'YOUR_API_KEY'};

 switch(s.type){case'object':return Object.fromEntries(Object.entries(s.properties||{}).map(([p,v])=>[p,exr(v,p)]));case'array':return[exr(s.items,k)];case'integer':case'number':return 1;case'boolean':return true;case'string':return s.format==='date-time'?'2026-10-15T09:30:00Z':(k in EX?EX[k]:'string')}return null}
const HD={'GET /r/{token}':'The page the referee opens from the link they receive. It shows the request and lets them authorize or decline.','POST /r/{token}/authorize':'Form post sent when the referee authorizes. Returns the confirmation page.','POST /r/{token}/decline':'Form post sent when the referee declines. Returns the confirmation page.','GET /c/{token}':'The status page the customer follows from customer_status_url.'};
const tn=t=>t==='Public'?'Hosted pages':t;
const HOSTED_INTRO='<p>Fidra serves these pages for people who are not API users. The referee opens <code>referee_authorize_url</code> and the customer follows <code>customer_status_url</code>, both returned when you create a request. Your integration does not call them directly.</p>';
function flow(sc){const all=(sc.RequestStatus&&sc.RequestStatus.enum)||[],has=x=>all.includes(x),

 return`<p style="margin:14px 0 4px"><b>Path A</b> · the referee confirms through a link (self-attested)</p>${row(A)}<p style="margin:14px 0 4px"><b>Path B</b> · the referee's bank is on the network and confirms the account</p>${row(B)}<p style="color:var(--mu);margin:14px 0 4px">Either path can also end as:</p><div class="flow x">${out.map(x=>`<span class="n chip ${tone(x)}"><i></i>${x}</span>`).join('')}</div>`}

function groupsOf(){const g=GROUPS.map(x=>({...x,list:x.ops.map(id=>ops.find(o=>o.operationId===id)).filter(Boolean)})),known=new Set(GROUPS.flatMap(x=>x.ops)),rest=ops.filter(o=>!known.has(o.operationId));if(rest.length)g.push({id:'more',title:'More',blurb:'',list:rest});return g}
const nm=o=>LABEL[o.operationId]||o.summary||o.p;
function spy(){if(!('IntersectionObserver' in window))return;const L={};$$('#nav a.ep').forEach(a=>L[a.getAttribute('href').slice(1)]=a);
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$('#nav a.on').forEach(x=>x.classList.remove('on'));if(L[e.target.id])L[e.target.id].classList.add('on')}}),{rootMargin:'-15% 0px -75% 0px'});$$('.op').forEach(o=>io.observe(o))}
function render(){
 const sc=spec.components&&spec.components.schemas||{},tags=[...new Set(ops.map(o=>o.tag))];
 $('#ver').textContent='v'+spec.info.version;$('#oj').href=BASE+'/openapi.json';
 const G=groupsOf();$('#nav').innerHTML='<input id="flt" placeholder="Search, for example: remind"><h4>Start here</h4><a href="#intro">Overview</a><a href="#auth">Your API key</a><a href="#status">What the statuses mean</a><a href="#errors">If something goes wrong</a>'+G.map(g=>`<h4>${g.title}</h4>`+g.list.map(o=>`<a class="ep" href="#${o.operationId}" title="${o.v.toUpperCase()} ${esc(o.p)}"><span class="m ${o.v.toUpperCase()}">${o.v.toUpperCase()}</span><span>${esc(nm(o))}</span></a>`).join('')).join('')+'<h4>Reference</h4><a href="#schemas">Data formats</a>';
 $('#flt').oninput=e=>$$('.ep').forEach(a=>a.hidden=!(a.textContent+' '+a.title).toLowerCase().includes(e.target.value.toLowerCase()));
 const tag=(spec.info.description||'').split('—').pop().trim()||'The rail that moves trust between institutions.';
 $('#main').innerHTML=`<select class="jump" onchange="if(this.value)location.hash=this.value" aria-label="Jump to a section"><option value="">Jump to a section</option><option value="intro">Overview</option><option value="auth">Your API key</option><option value="status">What the statuses mean</option>${G.map(g=>`<optgroup label="${g.title}">${g.list.map(o=>`<option value="${o.operationId}">${esc(nm(o))}</option>`).join('')}</optgroup>`).join('')}</select><section id="intro"><div class="ov">Reference exchange API</div><h1>Fidra API</h1><p class="lead">${esc(tag)}</p>
 <label for="base">Base URL</label><input id="base" value="${esc(BASE)}">
 <div class="card"><b>Quickstart</b><ol style="margin:8px 0 0;padding-left:20px"><li>Get your institution registered. A Fidra admin calls <code>POST /v1/institutions</code> and gives you the returned <code>api_key</code>, which is shown only once.</li><li><code>POST /v1/reference-requests</code> with your key in <code>X-API-Key</code>, the customer's name, and the referee's account number and bank code. The response includes <code>referee_authorize_url</code> and <code>customer_status_url</code>.</li><li><code>GET /v1/reference-requests/{public_id}</code> to follow <code>status</code> and <code>history</code> until the request reaches a final status.</li></ol></div></section>
 <section id="auth"><h2>Your API key</h2><p>Send your institution's key in the <code>X-API-Key</code> header. The key is shown once, when your institution is created by a Fidra admin, so store it securely. Paste it here to use it in the Try it panels. It stays in this tab only and is never added to the code samples.</p><label for="key">X-API-Key</label><input id="key" type="password" autocomplete="off" value="${esc(KEY)}" placeholder="Paste your API key"></section>
 <section id="status"><h2>What the statuses mean</h2><p>A reference request moves through these <code>status</code> values.</p>${flow(sc)}</section>
 <section id="errors"><h2>If something goes wrong</h2><p>Invalid requests return <code>422</code> with a <code>detail</code> array describing each problem. This applies to every endpoint.</p><pre class="ex">{\n  "detail": [\n    { "loc": ["body", "customer_full_name"], "msg": "Field required", "type": "missing" }\n  ]\n}</pre></section>
 ${G.map(g=>`<section id="g-${g.id}"><h2>${g.title}</h2>${g.blurb?`<p class="gb">${g.blurb}</p>`:''}${g.list.map(op).join('')}</section>`).join('')}
 <section id="schemas"><h2>Data formats</h2>${Object.entries(sc).filter(([n])=>!/ValidationError$/.test(n)).map(([n,s])=>`<details class="sch"><summary class="mono">${n}</summary>${s.enum?s.enum.map(e=>`<span class="chip ${tone(e)}">${e}</span>`).join(''):props(s)}</details>`).join('')}</section>`;
 $('#key').oninput=e=>KEY=e.target.value;spy();
 $('#base').onchange=e=>{BASE=e.target.value.replace(/\/$/,'');render();health()};
}
function start(s){spec=s;ops=[];for(const[p,m]of Object.entries(s.paths))for(const[v,o]of Object.entries(m))ops.push({...o,p,v,tag:(o.tags||[])[0]||'System'});render()}
async function health(){const h=$('#hs');h.className='hs';h.textContent='Checking…';try{const r=await fetch(BASE+'/health');if(!r.ok)throw 0;h.classList.add('up');h.textContent='All systems operational'}catch(e){h.classList.add('down');h.textContent='API unreachable'}}
async function load(){
 try{const r=await fetch(q.get('spec')||BASE+'/openapi.json');if(!r.ok)throw 0;start(await r.json())}
 catch(e){$('#main').innerHTML='<div class="op"><h2>Could not load the spec</h2><p>Fetching <code>'+esc(BASE)+'/openapi.json</code> failed. The API may be waking up, or CORS may be off for this origin. Load a saved copy instead:</p><input type="file" id="f" accept=".json">'+'</div>';$('#f').onchange=async e=>start(JSON.parse(await e.target.files[0].text()))}
 health()}
async function send(d){
 const o=ops.find(x=>x.operationId===d.dataset.id),out=$('.res',d),h={},ta=$('textarea',d);let p=o.p,body;
 $$('[data-path]',d).forEach(i=>p=p.replace('{'+i.dataset.path+'}',encodeURIComponent(i.value)));
 if((o.parameters||[]).some(x=>x.name==='X-API-Key')&&KEY)h['X-API-Key']=KEY;$$('[data-hdr]',d).forEach(i=>{if(i.value)h[i.dataset.hdr]=i.value});
 if(ta){const ct=Object.keys(o.requestBody.content)[0];h['Content-Type']=ct;try{const j=JSON.parse(ta.value);body=ct.includes('urlencoded')?new URLSearchParams(j).toString():JSON.stringify(j)}catch(e){out.innerHTML='<span class="chip bad">Body is not valid JSON</span>';return}}
 out.innerHTML='<span class="chip info">Sending…</span> <small>The first call can take about 30 seconds if the server is asleep.</small>';
 const t0=performance.now();
 try{const r=await fetch(BASE+p,{method:o.v.toUpperCase(),headers:h,body});let x=await r.text();try{x=JSON.stringify(JSON.parse(x),null,2)}catch(e){}
  out.innerHTML=`<span class="chip ${r.ok?'ok':'bad'}">${r.status} ${esc(r.statusText)}</span> <small>${Math.round(performance.now()-t0)} ms</small><pre>${esc(x.slice(0,4000))}</pre>`}
 catch(e){out.innerHTML='<span class="chip bad">Network error</span> <small>Is the server awake, and is CORS enabled for this origin?</small>'}}
document.addEventListener('click',async e=>{const t=e.target,c=t.closest&&t.closest('.code');
 if(t.dataset&&t.dataset.l!==undefined&&c){$$('.tabs button[data-l]',c).forEach(b=>b.classList.toggle('on',b===t));$$('pre',c).forEach((p,i)=>p.hidden=String(i)!==t.dataset.l)}
 else if(t.classList.contains('cp')&&c){try{await navigator.clipboard.writeText($$('pre',c).find(p=>!p.hidden).textContent);t.textContent='Copied';setTimeout(()=>t.textContent='Copy',1200)}catch(x){}}
 else if(t.classList.contains('send'))send(t.closest('.try'))});
load();
</script>
